name: '[CI] Continuous Integration'

# Quando rodar?
on:
  pull_request:
    types: [opened, synchronize]

#Quais tarefas(jobs)?
jobs:
  #Tarefa
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    steps:
      # [Common CI/CD Step]
      - uses: actions/checkout@v3 # Permite acessar os arquivos do projeto corretamente
      # =============================
      - name: 'Install Dependencies'
        run: 'npm install'
      - name: 'Lint'
        run: 'npm run lint'
  #Tarefa
  test:
    name: 'Test'
    runs-on: ubuntu-latest
    steps:
      # [Common CI/CD Step]
      - uses: actions/checkout@v3 # Permite acessar os arquivos do projeto corretamente
      # =============================
      - name: 'Install Dependencies'
        run: 'npm install'
      - name: 'Test'
        run: 'npm run test'
